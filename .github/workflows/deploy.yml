name: Deploy Backend

on:
  push:
    branches: [main]

env:
  PROJECT_ID:   project-3eab0e03-52db-4be0-a65
  REGION:       asia-south1
  SERVICE_NAME: telecom-api
  REGISTRY:     asia-south1-docker.pkg.dev

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build & push Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/telecom-api/app:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/telecom-api/app:latest \
            ./api
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/telecom-api/app:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/telecom-api/app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/telecom-api/app:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --memory=512Mi \
            --timeout=60 \
            --set-env-vars="\
          PROJECT_ID=${{ env.PROJECT_ID }},\
          AGENT_ID=${{ secrets.AGENT_ID }},\
          DATA_STORE_ID=${{ secrets.DATA_STORE_ID }},\
          LOCATION=asia-south1,\
          API_SECRET_KEY=${{ secrets.API_SECRET_KEY }},\
          DIALOGFLOW_SERVICE_ACCOUNT=${{ secrets.DIALOGFLOW_SERVICE_ACCOUNT }},\
          WEBHOOK_AUDIENCE=https://telecom-api-925349905681.asia-south1.run.app,\
          ALLOWED_ORIGINS=https://project-3eab0e03-52db-4be0-a65.web.app"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Deployed to: $URL"
          curl -f "$URL/health" || exit 1
